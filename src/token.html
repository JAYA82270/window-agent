<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Activate GetGRC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      background: #f4f6f8;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    .window {
      width: 100%;
      height: 100%;
      padding: 28px 32px 24px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: fadeIn 0.35s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid #e2e8f0;
    }

    .brand-logo {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      flex-shrink: 0;
      object-fit: contain;
    }

    .brand-name {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
      color: #0f172a;
    }

    .brand-tagline {
      margin-top: 3px;
      font-size: 0.8125rem;
      font-weight: 500;
      color: #64748b;
    }

    .title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.3;
      margin-bottom: 6px;
      color: #0f172a;
    }

    .description {
      font-size: 0.875rem;
      line-height: 1.5;
      color: #64748b;
      margin-bottom: 22px;
    }

    .field-label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: #64748b;
    }

    .key-input {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background: #ffffff;
      color: #0f172a;
      font-family: "Cascadia Code", "Consolas", "SF Mono", monospace;
      font-size: 0.9375rem;
      letter-spacing: 0.04em;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .key-input::placeholder {
      color: #94a3b8;
    }

    .key-input:focus {
      border-color: #00a86b;
      box-shadow: 0 0 0 3px rgba(0, 168, 107, 0.15);
    }

    .key-input:disabled {
      opacity: 0.6;
      background: #f1f5f9;
      cursor: not-allowed;
    }

    .activate-btn {
      width: 100%;
      height: 48px;
      margin-top: 14px;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(135deg, #00c896 0%, #00a86b 100%);
      color: #ffffff;
      font-family: inherit;
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 168, 107, 0.25);
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
    }

    .activate-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(0, 168, 107, 0.32);
      filter: brightness(1.03);
    }

    .activate-btn:active:not(:disabled) {
      transform: translateY(0);
      filter: brightness(0.97);
    }

    .activate-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    .status-slot {
      min-height: 36px;
      margin-top: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.8125rem;
      font-weight: 500;
      line-height: 1.35;
      text-align: center;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .status.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .status.info {
      color: #475569;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
    }

    .status.success {
      color: #047857;
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
    }

    .status.error {
      color: #b91c1c;
      background: #fef2f2;
      border: 1px solid #fecaca;
    }

    .status-icon {
      font-size: 0.875rem;
      line-height: 1;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="window">
    <div class="brand">
      <img class="brand-logo" src="assets/icon.png" alt="">
      <div>
        <div class="brand-name">GetGRC</div>
        <div class="brand-tagline">Device Security Monitor</div>
      </div>
    </div>

    <h2 class="title">Activate this device</h2>
    <p class="description">Enter the registration key from your organization to enable security monitoring.</p>

    <form id="form">
      <label class="field-label" for="registrationKey">Registration Key</label>
      <input
        id="registrationKey"
        class="key-input"
        type="text"
        placeholder="Enter registration key"
        autocomplete="off"
        spellcheck="false"
        required
        autofocus
      >
      <button type="submit" id="submitBtn" class="activate-btn">Activate device</button>

      <div class="status-slot">
        <div id="message" class="status" aria-live="polite">
          <span class="status-icon" id="statusIcon"></span>
          <span id="statusText"></span>
        </div>
      </div>
    </form>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    const STATUS = {
      info: { icon: '◌', text: '' },
      success: { icon: '✓', text: '' },
      error: { icon: '✕', text: '' },
    };

    function setStatus(type, text) {
      const message = $('message');
      const icon = $('statusIcon');
      const statusText = $('statusText');

      message.className = `status ${type}`;
      if (text) {
        icon.textContent = STATUS[type]?.icon || '';
        statusText.textContent = text;
        message.classList.add('visible');
      } else {
        icon.textContent = '';
        statusText.textContent = '';
        message.classList.remove('visible');
      }
    }

    (async () => {
      const config = await window.shyldoneToken.getConfig();
      if (config.registrationKey) {
        $('registrationKey').value = config.registrationKey;
      }
    })();

    const formatError = (error) => {
      const raw = error?.message || 'Activation failed. Please try again.';
      return raw.replace(/^Error invoking remote method '[^']+':\s*(?:Error:\s*)?/i, '').trim() || raw;
    };

    $('form').onsubmit = async (e) => {
      e.preventDefault();
      const registrationKey = $('registrationKey').value.trim();
      if (!registrationKey) return;

      setStatus('info', 'Validating registration key…');
      $('submitBtn').disabled = true;
      $('registrationKey').disabled = true;

      try {
        const result = await window.shyldoneToken.activate(registrationKey);
        setStatus('success', result.message || 'Activation successful');
        setTimeout(() => window.close(), 900);
      } catch (error) {
        setStatus('error', formatError(error));
        $('submitBtn').disabled = false;
        $('registrationKey').disabled = false;
      }
    };
  </script>
</body>
</html>
